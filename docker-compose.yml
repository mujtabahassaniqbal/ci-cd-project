version: "3.9"

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=quiz
      - POSTGRES_PASSWORD=dev-db-password-change-me
      - POSTGRES_DB=auth_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth_service:
    build: ./auth_service
    ports:
      - "8001:8000"
    environment:
      - JWT_SECRET=dev-shared-jwt-secret-change-me
      - INTERNAL_API_KEY=dev-internal-key-change-me
      - DJANGO_DEBUG=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=quiz
      - POSTGRES_PASSWORD=dev-db-password-change-me
    depends_on:
      db:
        condition: service_healthy

  game_service:
    build: ./game_service
    ports:
      - "8002:8000"
    environment:
      - JWT_SECRET=dev-shared-jwt-secret-change-me
      - INTERNAL_API_KEY=dev-internal-key-change-me
      - AUTH_SERVICE_URL=http://auth_service:8000
      - DJANGO_DEBUG=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=game_db
      - POSTGRES_USER=quiz
      - POSTGRES_PASSWORD=dev-db-password-change-me
    depends_on:
      db:
        condition: service_healthy
      auth_service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_AUTH_API_URL=http://localhost:8001
      - VITE_GAME_API_URL=http://localhost:8002
    depends_on:
      - auth_service
      - game_service

volumes:
  db_data:
